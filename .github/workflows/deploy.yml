# Build the site and put it on the host.
#
# This never talks to Notion: the content is committed, so a deploy is
# reproducible from the repository alone. `sync.yml` is what fetches content,
# and it calls this once it has committed something.
#
# The tests gate the deploy on purpose. If they fail the previous release stays
# live. A stale site is better than a broken one.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE*', 'reference/**']
  # A daily rebuild, because one thing on this site depends on the date it was
  # built: a public training run disappears the day after it ends. Nothing
  # pushes on the day that happens, so without this a finished workshop would
  # sit on the page advertising itself until the next content change.
  schedule:
    - cron: '20 3 * * *'
  # A pull request gets everything above the deploy line: types, build, the
  # blocking suite. Without this a dependency bump could only be judged after it
  # had already landed on main.
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE*', 'reference/**']
  workflow_call:
    inputs:
      changes:
        description: A short human summary of what changed, for the notification.
        type: string
        required: false
      ref:
        # A called workflow runs at the *caller's* commit, and the sync commits
        # after its run began. So without this the deploy builds the site as it
        # was before the content it was called to publish.
        description: The commit to build. Defaults to the one that triggered the run.
        type: string
        required: false
  workflow_dispatch:

# One deploy at a time: two rsyncs into the same directory would interleave.
# Production is one queue and stays one queue. Pull requests get a queue each,
# keyed by branch, so a rehearsal cannot jostle a release in either direction.
concurrency:
  group: >-
    deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only. This job builds and rsyncs; it never writes to the repository.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the guard below diffs against the previous commit
          ref: ${{ inputs.ref || github.sha }}

      # Say which commit is being published, every time. The defect this guards
      # against is invisible precisely because nothing ever prints it: the run
      # is green, the summary names the content that changed, and the build is
      # of the commit before it.
      - name: What is being built?
        env:
          ASKED: ${{ inputs.ref }}
        run: |
          echo "Building $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "  asked for: ${ASKED:-<the triggering commit>}" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='  %s' >> "$GITHUB_STEP_SUMMARY"

      # Rule 1: src/content/ is generated. A push that changes it from anyone
      # but the sync is rejected here rather than quietly becoming the new truth
      # until the next sync overwrites it.
      - name: Was src/content/ hand-edited?
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch; nothing to diff against." && exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$SHA" -- src/content/ || true)
          [ -z "$CHANGED" ] && exit 0
          AUTHORS=$(git log --format='%an' "$BEFORE".."$SHA" -- src/content/ | sort -u)
          if echo "$AUTHORS" | grep -qvE '^(github-actions\[bot\]|CoMo sync)$'; then
            echo "::error::src/content/ changed, and not only by the sync. It is generated from Notion, edit Notion, not these files."
            echo "$CHANGED"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Install the browser the tests drive
        run: npx playwright install --with-deps chromium

      # Types, unit tests, the build, then the blocking suite. `npm test` runs
      # them in that order on purpose: `astro check` is the cheapest thing that
      # can fail, so it fails first.
      - name: Test
        run: npm test

      - name: Is there anywhere to deploy to?
        id: gate
        env:
          HOST: ${{ secrets.KUALO_HOST }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Pull request: built and tested, not deployed." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$HOST" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No KUALO_HOST secret set, so nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # Releases are atomic. Each release is rsynced into a directory of its own
      # and the document root is a SYMLINK, swapped once the copy is complete,
      # so nobody meets a half-written site and a rollback is one `ln -sfn`.
      #
      # The shape, and every guard below it, is ported from virtualddd.com,
      # which has been deploying to this host since 28 July 2026. Each guard is
      # a failure that happened there.
      - name: Deploy
        id: release
        if: steps.gate.outputs.go == 'true'
        env:
          SSH_KEY: ${{ secrets.KUALO_SSH_KEY }}
          HOST: ${{ secrets.KUALO_HOST }}
          SSH_USER: ${{ secrets.KUALO_USER }}
          DOCROOT: ${{ secrets.KUALO_PATH }}
          PORT: ${{ secrets.KUALO_SSH_PORT || '22' }}
          KEEP: 5
        run: |
          set -euo pipefail

          # `KUALO_PATH` is interpolated inside single quotes in a shell on the
          # host, so `~` is never expanded. A value starting with `~` fails at
          # the very last step, after a green build and a complete upload, with
          # the host looking for a directory literally called "~".
          case "$DOCROOT" in
            /*) ;;
            "~"*) echo "::error::KUALO_PATH starts with ~, which is never expanded. Use the absolute path, e.g. /home/<user>/collaborative-software-design.com."; exit 1 ;;
            *) echo "::error::KUALO_PATH must be an absolute path beginning with /."; exit 1 ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Reachability, in three separate questions, because they have three
          # different answers and one message for all of them says nothing.
          # The first deploy failed here in 19 milliseconds and the log said
          # "cannot reach", which is true of a wrong hostname, a closed port
          # and a firewall alike.
          case "$PORT" in
            ''|*[!0-9]*)
              echo "::error::KUALO_SSH_PORT is not a plain number (${#PORT} characters)."
              echo "A trailing newline or space from a paste is the usual cause."
              echo "Set it with: gh secret set KUALO_SSH_PORT --body 722"
              exit 1 ;;
          esac

          if [ -z "$(getent hosts "$HOST" || true)" ]; then
            echo "::error::KUALO_HOST does not resolve from this runner (${#HOST} characters)."
            echo "Check the value for a trailing newline, an https:// prefix, or a port"
            echo "stuck on the end. It wants a bare hostname, e.g. sNN.kualo.com."
            exit 1
          fi

          # Refused comes back at once; a firewall drop takes the full timeout.
          # The two are worth telling apart, because only one of them is worth
          # re-running.
          START=$(date +%s)
          if ! timeout 20 bash -c "</dev/tcp/$HOST/$PORT" 2>/dev/null; then
            WAITED=$(( $(date +%s) - START ))
            echo "::error::Nothing accepted a connection on port $PORT after ${WAITED}s."
            if [ "$WAITED" -lt 5 ]; then
              echo "It resolved and refused immediately, so the port is almost certainly"
              echo "wrong. Read it off cPanel: Security > SSH Access. Kualo is not 22."
            else
              echo "It resolved and then hung, which is a firewall dropping packets."
              echo "Usually the host's brute-force protection blocking a GitHub runner's"
              echo "shared IP: Kualo calls it cPHulk. Re-run, the next runner draws a"
              echo "different address."
            fi
            exit 1
          fi

          # The host key is taken fresh each run rather than pinned in a
          # secret. Be clear about what that is and is not: the key arrives
          # over the same connection an attacker would have to control to
          # impersonate the host, so this is trust on first use, every run. It
          # is not a defence against a machine-in-the-middle.
          #
          # What it still rules out is the thing StrictHostKeyChecking=no
          # invites, a connection to a host offering no key at all, and what
          # is at stake is small: SSH binds the client's signature to the
          # session, and the session hash covers the server's host key, so an
          # impostor cannot forward this authentication to the real host. The
          # deploy key cannot be captured. A copy of a public website can.
          #
          # The trade is availability: a pinned key breaks every deploy the day
          # the host rotates it, and the failure reads as a network problem.
          # virtualddd.com made this call first; see docs/operations.md.
          #
          # Say why when it fails. Swallowing ssh-keyscan's stderr cost
          # virtualddd.com an afternoon: the deploy failed in six silent
          # seconds with no host key to verify against, and the log said
          # nothing at all.
          if ! ssh-keyscan -T 15 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            echo "::error::ssh-keyscan failed:"; cat /tmp/keyscan.err; exit 1
          fi
          grep -q . ~/.ssh/known_hosts || {
            echo "::error::ssh-keyscan returned no host key for $HOST:$PORT."
            cat /tmp/keyscan.err
            exit 1
          }
          chmod 600 ~/.ssh/known_hosts

          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes -o ConnectTimeout=20"

          # The commit that was BUILT, which is not github.sha when the sync
          # called this workflow: a called workflow runs at the caller's commit
          # and the sync commits after its run began. A release directory named
          # after anything else makes a rollback pick the wrong site.
          SHA="$(git rev-parse HEAD)"
          # Namespaced by site. virtualddd.com prunes `~/releases/*` on the same
          # account, and an unnamespaced directory here would be deleted by its
          # next deploy, possibly the one this site is serving.
          RELEASE="releases/collaborative-software-design.com/$SHA"

          $SSH "$SSH_USER@$HOST" "
            set -e
            # Never replace a real directory. If the document root is not
            # already a symlink it may be the WordPress site, or somebody
            # else's, and a deploy job is not the place to find that out.
            # Switching a domain over is a deliberate, one-time human step;
            # see docs/operations.md.
            if [ -e '$DOCROOT' ] && [ ! -L '$DOCROOT' ]; then
              # An EMPTY directory is nobody's site. cPanel puts one back the
              # moment a document root is renamed away, so refusing it stopped
              # the cutover with the domain already 404ing. `rmdir` cannot
              # remove a directory with anything in it, which is what keeps
              # this safe: the refusal below is still the only path for a
              # directory that holds something.
              if [ -d '$DOCROOT' ] && [ -z "$(ls -A '$DOCROOT' 2>/dev/null)" ]; then
                echo 'Document root is an empty directory. Removing it so the release symlink can take its place.'
                rmdir '$DOCROOT'
              else
                echo '$DOCROOT exists and is not a symlink, and it is not empty.'
                echo 'Refusing to touch it. See docs/operations.md for the cutover.'
                # Say what is actually there. Refusing without showing the
                # layout sends somebody back to cPanel to find out whether the
                # path is wrong or the rename did not take, and the two look
                # identical from here. The names are not secret; the path is,
                # and Actions masks it.
                echo
                echo 'What that path holds (first 12):'
                ls -A1 '$DOCROOT' 2>/dev/null | head -12 | sed 's/^/  /'
                echo
                echo 'Directories in the home directory:'
                ls -1 \"\$HOME\" 2>/dev/null | head -30 | sed 's/^/  /'
                exit 1
              fi
            fi
            # Said here rather than at the swap, where it arrives as one opaque
            # line from ln at the end of a deploy that otherwise worked.
            if [ ! -d \"\$(dirname '$DOCROOT')\" ]; then
              echo \"KUALO_PATH's parent directory does not exist on this host:\"
              echo \"  \$(dirname '$DOCROOT')\"
              echo 'Check the value against \$HOME on the host: the cPanel user is often not what the domain suggests.'
              exit 1
            fi
            mkdir -p '$RELEASE'
          "

          rsync --archive --compress --delete --human-readable \
            -e "$SSH" dist/ "$SSH_USER@$HOST:$RELEASE/"

          # The swap, and the tidy-up. `ln -sfn` is atomic; keeping five
          # releases means a rollback needs no deploy at all.
          $SSH "$SSH_USER@$HOST" "
            set -e
            ln -sfn \"\$HOME/$RELEASE\" '$DOCROOT'
            ls -1dt \"\$HOME\"/releases/collaborative-software-design.com/*/ \
              | tail -n +\$(( $KEEP + 1 )) | xargs -r rm -rf
            echo \"live: \$(readlink '$DOCROOT')\"
          "
          echo "Published $RELEASE" >> "$GITHUB_STEP_SUMMARY"
          rm -f ~/.ssh/deploy_key

      # Apache does not pick the new release up the instant the symlink moves.
      # Measured on virtualddd.com: for the best part of a minute afterwards
      # every address answers 200 from the document root, 105 of 105 sampled
      # URLs, no redirects and no 410s, and then it is entirely correct.
      # Verifying inside that window fails a deploy that shipped perfectly.
      - name: Let the release settle
        if: steps.gate.outputs.go == 'true'
        run: sleep 60

      # A deploy that rsyncs successfully and serves the previous release is the
      # failure this catches: everything green, site stale. `secrets` is not
      # available in a step-level `if:`, so the check is inside the step.
      - name: Verify the deployed host
        if: steps.gate.outputs.go == 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "No SITE_URL secret, so the deploy was not verified." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm run verify:live "$SITE_URL"
